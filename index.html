<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopy's Playground - Alliance Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fredoka+One&family=Montserrat:wght@600;700;800&family=Noto+Sans+SC:wght@900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --login-bg: #ffffff;
            --login-primary-blue: #324796;
            --login-light-blue: #c3d2f8;
            --login-text-title: #2d4187;
            --login-text-guest: #4f63a8;
            --login-btn-bg: #f3a808;
            --login-btn-hover: #e29a00;
            --login-btn-text: #ffffff;
            --login-star: #f3a808;

            --color-bg-main: #f5f4ef;
            --color-bg-card: #ffffff;
            --color-bg-sidebar: #ffffff;
            --color-primary: #3b52a4;
            --color-primary-dark: #2d3a91;
            --color-primary-light: #eceff8;
            --color-text-dark: #2b3044;
            --color-text-muted: #8c93a6;
            --color-text-light: #a0a6b5;
            --color-border: #3b52a4;
            --color-border-light: #e2e5ed;
            --color-yellow-bg: #fffdf0;
            --color-yellow-border: #e2cb6b;
            --color-yellow-text: #b89117;
            --color-gold: #f3a808;
            --color-gold-bg: #fffdf0;
            --color-not-attended: #d9381e;

            --font-family-base: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-family-ui: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-family-title: 'Cinzel', serif;
            --font-family-logo: 'Noto Sans SC', sans-serif;

            --font-xs: 12px;
            --font-sm: 14px;
            --font-md: 16px;
            --font-lg: 20px;
            --font-xl: 24px;
            --font-xxl: 32px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family-base); background-color: var(--color-bg-main); color: var(--color-text-dark); min-height: 100vh; font-size: var(--font-sm); }

        /* LOGIN SCREEN */
        .login-page { display: flex; flex-direction: column; min-height: 100vh; background-color: var(--login-bg); font-family: var(--font-family-base); }
        .login-header { width: 100%; padding: 18px 28px; display: flex; justify-content: flex-end; align-items: center; }
        .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px; }
        .login-card { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 520px; width: 100%; }
        .login-card__logo-wrapper { position: relative; width: 200px; height: 200px; margin-bottom: 36px; display: flex; justify-content: center; align-items: center; }
        .login-card__logo-circle { width: 100%; height: 100%; border-radius: 50%; background-color: var(--login-light-blue); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .login-card__logo-text { font-family: var(--font-family-logo); font-size: 96px; font-weight: 900; color: var(--login-primary-blue); line-height: 1; letter-spacing: -4px; user-select: none; }
        .login-card__logo-star { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); color: var(--login-star); font-size: 44px; line-height: 1; z-index: 2; }
        .login-card__title { font-family: var(--font-family-title); font-size: var(--font-xxl); font-weight: 700; color: var(--login-text-title); letter-spacing: 1.5px; margin-bottom: 36px; text-transform: uppercase; }
        .login-card__button { background-color: var(--login-btn-bg); color: var(--login-btn-text); border: none; border-radius: 12px; padding: 18px 0; width: 220px; font-family: var(--font-family-base); font-size: var(--font-md); font-weight: 800; cursor: pointer; margin-bottom: 18px; transition: background 0.2s; }
        .login-card__button:hover { background-color: var(--login-btn-hover); }
        .login-card__guest-link { background: none; border: none; color: var(--login-text-guest); font-family: var(--font-family-base); font-size: var(--font-sm); font-weight: 700; cursor: pointer; text-transform: uppercase; margin-bottom: 14px; }
        .login-card__guest-link:hover { text-decoration: underline; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: white; padding: 32px; border-radius: 10px; width: 100%; max-width: 420px; border: 2px solid var(--color-primary); }
        .modal-card h3 { margin-bottom: 16px; color: var(--color-primary); font-size: var(--font-lg); font-family: var(--font-family-title); }
        .modal-card input, .modal-card select { width: 100%; padding: 14px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 6px; font-size: var(--font-sm); font-family: var(--font-family-base); }
        .modal-card-btns { display: flex; justify-content: flex-end; gap: 12px; }
        .login-error-msg { color: #dc2626; font-size: var(--font-xs); font-weight: 700; margin-bottom: 12px; display: none; text-align: left; }

        /* DASHBOARD */
        .app { display: none; width: 100%; min-height: 100vh; }
        .sidebar { width: 300px; background-color: var(--color-bg-sidebar); border-right: 2px solid var(--color-border); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; z-index: 100; }
        .sidebar__header { padding: 24px; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid var(--color-border); }
        .sidebar__logo { width: 85px; height: 85px; border-radius: 50%; background: linear-gradient(135deg, #a5c7f9, #2d55b8); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 30px; font-family: var(--font-family-logo); }
        .sidebar__user { padding: 18px 24px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: var(--font-sm); color: #62697b; border-bottom: 1px solid var(--color-border-light); }
        .sidebar__user-avatar { width: 42px; height: 42px; border-radius: 50%; background-color: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: var(--font-sm); font-weight: 800; }
        .sidebar__nav { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-bottom: 24px; flex-grow: 1; }
        .sidebar__footer { padding: 14px 24px; border-top: 1px solid var(--color-border-light); margin-top: auto; }
        .sidebar__menu { list-style: none; }
        .sidebar__section-title { font-size: var(--font-xs); font-weight: 800; color: #8c93a6; padding: 18px 24px 8px 24px; text-transform: uppercase; letter-spacing: 0.5px; }
        .sidebar__item { display: flex; align-items: center; padding: 14px 24px; color: #555b6e; font-weight: 700; font-size: var(--font-xs); text-decoration: none; gap: 14px; cursor: pointer; transition: background 0.2s; }
        .sidebar__item:hover { background-color: #f0f2f8; }
        .sidebar__item--active { background-color: var(--color-primary); color: white; }
        .sidebar__item--logout { color: #d9381e; }
        .sidebar__item--logout:hover { background-color: #fce8e6; }
        .sidebar__icon { width: 18px; text-align: center; }

        .main { flex-grow: 1; padding: 28px; display: flex; flex-direction: column; gap: 18px; max-width: 1320px; }
        .mobile-header { display: none; justify-content: space-between; align-items: center; padding: 14px 18px; background: white; border: 2px solid var(--color-border); border-radius: 10px; margin-bottom: 14px; }
        .hamburger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 5px; }
        .hamburger__line { width: 26px; height: 3px; background-color: var(--color-primary); border-radius: 2px; }

        /* Unified Match with VS Tab Controls Style */
        .page-header-top { display: flex; flex-direction: column; gap: 4px; margin-bottom: 2px; }
        .page-header-top__back { font-family: var(--font-family-ui); font-size: 12px; font-weight: 800; color: var(--color-primary); text-decoration: none; margin-bottom: 2px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .page-header-top__back:hover { text-decoration: underline; }
        .page-header-top__title { font-family: var(--font-family-ui); font-weight: 800; font-size: 34px; letter-spacing: -1px; color: var(--color-primary-dark); text-transform: uppercase; line-height: 1.1; }
        .page-header-top__subtext { font-family: var(--font-family-ui); font-size: 14px; font-weight: 700; color: var(--color-text-muted); margin-top: 4px; }

        /* Controls Card matching VS tab reference styling */
        .controls-card { background: white; border: 2px solid var(--color-border); border-radius: 6px; padding: 16px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }

        .btn-group { display: flex; background: #edf2f7; padding: 3px; border-radius: 4px; }
        .btn-toggle { padding: 8px 16px; font-weight: 800; font-size: 11px; border: none; background: transparent; color: var(--color-text-muted); cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: var(--font-family-ui); border-radius: 3px; transition: all 0.15s; }
        .btn-toggle--active { background-color: var(--color-primary-dark); color: white; }

        .search-box { flex-grow: 1; max-width: 280px; position: relative; }
        .search-box__input { width: 100%; padding: 9px 12px 9px 32px; border: 1px solid #d1d5db; background-color: #f7f6f0; border-radius: 4px; font-size: 13px; outline: none; font-family: var(--font-family-ui); color: var(--color-text-dark); font-weight: 600; }
        .search-box__input::placeholder { color: #9ca3af; font-weight: 600; }
        .search-box__icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 13px; }

        .controls-right-group { display: flex; gap: 12px; align-items: center; margin-left: auto; flex-wrap: wrap; }

        .date-input-wrapper { display: flex; align-items: center; gap: 8px; }
        .admin-panel__input-date { padding: 8px 12px; border: 2px solid var(--color-gold); background-color: var(--color-gold-bg); border-radius: 4px; font-size: 12px; outline: none; font-family: var(--font-family-ui); font-weight: 800; color: var(--color-text-dark); cursor: pointer; }
        .admin-panel__input-text { padding: 8px 12px; border: 2px solid var(--color-gold); background-color: var(--color-gold-bg); border-radius: 4px; font-size: 12px; outline: none; font-family: var(--font-family-ui); font-weight: 800; color: var(--color-text-dark); width: 140px; }
        .admin-panel__input-text::placeholder { color: #b89117; font-weight: 700; }

        .btn-action-custom { background: white; border: 2px solid var(--color-primary); color: var(--color-primary); font-weight: 800; font-size: 12px; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-family: var(--font-family-ui); display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s; }
        .btn-action-custom--add, .btn-action-custom--import { border: 2px solid var(--color-gold); color: var(--color-gold); background: var(--color-gold-bg); letter-spacing: 0.5px; }
        .btn-action-custom--add:hover, .btn-action-custom--import:hover { background-color: var(--color-gold); color: white; }
        .btn-diff { background: var(--color-gold-bg); border: 2px solid var(--color-gold); color: var(--color-gold); font-weight: 800; font-size: 12px; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-family: var(--font-family-ui); letter-spacing: 0.5px; transition: all 0.15s; }
        .btn-diff:hover { background-color: var(--color-gold); color: white; }
        .btn-diff.active { background-color: var(--color-primary-dark); border-color: var(--color-primary-dark); color: white; }

        /* Top 5 Legend & Info Bar */
        .top-legend-bar { display: flex; align-items: center; gap: 16px; font-family: var(--font-family-ui); font-size: 12px; font-weight: 700; color: var(--color-text-dark); flex-wrap: wrap; margin-top: 4px; padding: 0 4px; }
        .top-legend-bar__title { font-weight: 800; color: var(--color-text-dark); text-transform: uppercase; }
        .legend-pill-item { display: flex; align-items: center; gap: 4px; }
        .badge-rank { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 10px; font-weight: 800; color: white; }
        .badge-rank.r1, .top-pill--1 { background-color: #f3a808; }
        .badge-rank.r2, .top-pill--2 { background-color: #a0aec0; }
        .badge-rank.r3, .top-pill--3 { background-color: #b7791f; }
        .badge-rank.r4, .top-pill--4 { background-color: #3182ce; }
        .badge-rank.r5, .top-pill--5 { background-color: #e53e3e; }
        .vs-hint { color: var(--color-text-muted); font-weight: 600; font-size: 11px; font-style: italic; }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid var(--color-border); border-radius: 8px; background: white; overflow: hidden; display: none; }

        .table-card { background: white; border: 2px solid var(--color-border); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; font-family: var(--font-family-ui); }
        .data-table th { background-color: #e9ecf7; padding: 14px 12px; font-size: 11px; font-weight: 800; color: var(--color-primary-dark); text-transform: uppercase; border-bottom: 2px solid var(--color-primary); white-space: nowrap; }
        .data-table td { padding: 12px; border-bottom: 1px solid var(--color-border-light); vertical-align: middle; font-weight: 700; color: var(--color-text-dark); }
        .data-table tfoot td { background-color: #f8f9fa; border-top: 2px solid var(--color-border-light); padding: 12px; font-size: 11px; font-weight: 800; color: var(--color-text-muted); }

        .data-table tr.rank-1 { background-color: #fffdf5; }
        .data-table tr.rank-2 { background-color: #faf9f5; }
        .data-table tr.rank-3 { background-color: #fcfbf7; }

        .col-rank { width: 40px; text-align: center; color: var(--color-text-muted); font-weight: 700; }
        .col-name { font-weight: 800; color: var(--color-text-dark); }
        .col-attended { width: 110px; text-align: center; font-size: var(--font-sm); font-weight: 800; }
        .col-percentage { width: 130px; text-align: center; font-size: var(--font-sm); font-weight: 800; }
        .col-event { width: 110px; text-align: center; }
        .col-actions { width: 80px; text-align: center; }

        .attended-high { color: #2563eb; }
        .attended-mid { color: #b89117; }
        .attended-low { color: #dc2626; }

        .vs-avg-pos { color: #2563eb; font-weight: 800; }
        .vs-avg-neg { color: #dc2626; font-weight: 800; }

        .diff-green { color: #16a34a; font-weight: 850; font-size: var(--font-xs); display: inline-flex; align-items: center; gap: 4px; }
        .diff-red { color: #dc2626; font-weight: 850; font-size: var(--font-xs); display: inline-flex; align-items: center; gap: 4px; }
        .diff-yellow { color: #ca8a04; font-weight: 850; font-size: var(--font-xs); display: inline-flex; align-items: center; gap: 4px; }

        .check-toggle { cursor: pointer; padding: 6px 10px; border-radius: 6px; user-select: none; }
        .check-icon { color: var(--color-primary); font-weight: 800; font-size: var(--font-md); }
        .cross-icon { color: #ccc; font-weight: bold; }
        .editable-num { cursor: pointer; border-bottom: 1px dashed var(--color-primary); }

        .progress-bar-container { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 140px; }
        .progress-bar { height: 10px; flex-grow: 1; background-color: #eef0f5; border-radius: 5px; overflow: hidden; }
        .progress-bar__fill { height: 100%; border-radius: 5px; }
        .progress-bar__fill.high { background-color: #2563eb; } /* 75-100 blue */
        .progress-bar__fill.mid { background-color: #eab308; }   /* 50-74 yellow */
        .progress-bar__fill.low { background-color: #dc2626; }   /* 0-49 red */
        .progress-text { font-size: 12px; font-weight: 800; min-width: 42px; text-align: right; }

        .ranking-cards-list { display: flex; flex-direction: column; gap: 12px; }
        .ranking-card { background-color: #ffffff; border: 1px solid var(--color-border-light); border-radius: 6px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; font-family: var(--font-family-ui); }
        .ranking-card--rank-1 { border: 2px solid #f3a808; background-color: var(--color-gold-bg); }
        .ranking-card--rank-2 { border: 2px solid #a0aec0; background-color: #ffffff; }
        .ranking-card--rank-3 { border: 2px solid #b7791f; background-color: #fffaf5; }
        .ranking-card--rank-4 { border: 2px solid #3182ce; background-color: #f7fafc; }
        .ranking-card--rank-5 { border: 2px solid #e53e3e; background-color: #fff5f5; }
        
        .ranking-card__left { display: flex; align-items: center; gap: 18px; min-width: 240px; }
        .ranking-card__badge { font-size: 10px; font-family: var(--font-family-ui); width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 50%; color: #ffffff; }
        .ranking-card--rank-1 .ranking-card__badge { background: #f3a808; }
        .ranking-card--rank-2 .ranking-card__badge { background: #a0aec0; }
        .ranking-card--rank-3 .ranking-card__badge { background: #b7791f; }
        .ranking-card--rank-4 .ranking-card__badge { background: #3182ce; }
        .ranking-card--rank-5 .ranking-card__badge { background: #e53e3e; }
        
        .ranking-card__name { font-weight: 800; font-size: 15px; color: var(--color-text-dark); }
        .ranking-card__subtext { font-size: 11px;
