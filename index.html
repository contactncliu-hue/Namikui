<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopy’s Playground Management</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #ff6b81;
            --text-color: #f1f1f1;
            --border-color: #404040;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
        }

        .edit-title-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .edit-title-btn:hover {
            color: var(--text-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button.btn:hover {
            opacity: 0.9;
        }

        .admin-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Modal Styles for Editing Event Title */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-secondary {
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-container">
            <h1 id="eventTitle">Loopy’s Playground</h1>
            <button class="edit-title-btn" onclick="openRenameModal()" title="Rename Event">✏️</button>
        </div>
    </header>

    <!-- Admin Section -->
    <section class="card">
        <h2>Admin Authentication</h2>
        <div class="form-group">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword">
        </div>
        <button class="btn" onclick="verifyAdmin()">Login</button>
    </section>
</div>

<!-- Modal for Renaming Event -->
<div class="modal" id="renameModal">
    <div class="modal-content">
        <h3>Rename Event</h3>
        <div class="form-group">
            <label for="newEventName">New Event Name</label>
            <input type="text" id="newEventName">
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeRenameModal()">Cancel</button>
            <button class="btn" onclick="saveEventName()">Save</button>
        </div>
    </div>
</div>

<script>
    // Initialize Event Title from LocalStorage or default
    document.addEventListener("DOMContentLoaded", () => {
        const savedTitle = localStorage.getItem("eventName");
        if (savedTitle) {
            document.getElementById("eventTitle").textContent = savedTitle;
        }
    });

    function openRenameModal() {
        const currentTitle = document.getElementById("eventTitle").textContent;
        document.getElementById("newEventName").value = currentTitle;
        document.getElementById("renameModal").style.display = "flex";
    }

    function closeRenameModal() {
        document.getElementById("renameModal").style.display = "none";
    }

    function saveEventName() {
        const newName = document.getElementById("newEventName").value.trim();
        if (newName !== "") {
            document.getElementById("eventTitle").textContent = newName;
            localStorage.setItem("eventName", newName);
            closeRenameModal();
        }
    }

    function verifyAdmin() {
        const passwordInput = document.getElementById("adminPassword").value;
        // Password check logic here
        if (passwordInput) {
            alert("Authenticated.");
        }
    }
</script>

</body>
</html>
