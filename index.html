<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopy's Playground - Alliance Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fredoka+One&family=Montserrat:wght@600;700;800&family=Noto+Sans+SC:wght@900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --login-bg: #ffffff;
            --login-primary-blue: #324796;
            --login-light-blue: #c3d2f8;
            --login-text-title: #2d4187;
            --login-text-guest: #4f63a8;
            --login-btn-bg: #f3a808;
            --login-btn-hover: #e29a00;
            --login-btn-text: #ffffff;
            --login-star: #f3a808;

            --color-bg-main: #f5f4ef;
            --color-bg-card: #ffffff;
            --color-bg-sidebar: #ffffff;
            --color-primary: #3b52a4;
            --color-primary-light: #eceff8;
            --color-text-dark: #2b3044;
            --color-text-muted: #8c93a6;
            --color-text-light: #a0a6b5;
            --color-border: #3b52a4;
            --color-border-light: #e2e5ed;
            --color-yellow-bg: #fffdf0;
            --color-yellow-border: #e2cb6b;
            --color-yellow-text: #b89117;
            --color-gold: #f3a808;

            --font-family-base: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-family-title: 'Cinzel', serif;
            --font-family-logo: 'Noto Sans SC', sans-serif;

            --font-xs: 11px;
            --font-sm: 13px;
            --font-md: 15px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-xxl: 28px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--color-bg-main); color: var(--color-text-dark); min-height: 100vh; }

        /* LOGIN SCREEN */
        .login-page { display: flex; flex-direction: column; min-height: 100vh; background-color: var(--login-bg); font-family: var(--font-family-base); }
        .login-header { width: 100%; padding: 16px 24px; display: flex; justify-content: flex-end; align-items: center; }
        .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-card { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 480px; width: 100%; }
        .login-card__logo-wrapper { position: relative; width: 180px; height: 180px; margin-bottom: 32px; display: flex; justify-content: center; align-items: center; }
        .login-card__logo-circle { width: 100%; height: 100%; border-radius: 50%; background-color: var(--login-light-blue); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .login-card__logo-text { font-family: var(--font-family-logo); font-size: 80px; font-weight: 900; color: var(--login-primary-blue); line-height: 1; letter-spacing: -4px; user-select: none; }
        .login-card__logo-star { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); color: var(--login-star); font-size: 38px; line-height: 1; z-index: 2; }
        .login-card__title { font-family: var(--font-family-title); font-size: 22px; font-weight: 700; color: var(--login-text-title); letter-spacing: 1.5px; margin-bottom: 32px; text-transform: uppercase; }
        .login-card__button { background-color: var(--login-btn-bg); color: var(--login-btn-text); border: none; border-radius: 10px; padding: 14px 0; width: 180px; font-family: var(--font-family-base); font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 16px; }
        .login-card__guest-link { background: none; border: none; color: var(--login-text-guest); font-family: var(--font-family-base); font-size: 14px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-bottom: 12px; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: white; padding: 24px; border-radius: 8px; width: 100%; max-width: 360px; border: 2px solid var(--color-primary); }
        .modal-card h3 { margin-bottom: 12px; color: var(--color-primary); font-size: 16px; }
        .modal-card input, .modal-card select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .modal-card-btns { display: flex; justify-content: flex-end; gap: 8px; }

        /* DASHBOARD */
        .app { display: none; width: 100%; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--color-bg-sidebar); border-right: 2px solid var(--color-border); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; z-index: 100; }
        .sidebar__header { padding: 20px; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid var(--color-border); }
        .sidebar__logo { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #a5c7f9, #2d55b8); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 24px; }
        .sidebar__user { padding: 16px 20px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: var(--font-sm); color: #62697b; border-bottom: 1px solid var(--color-border-light); }
        .sidebar__user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .sidebar__nav { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding-bottom: 20px; flex-grow: 1; }
        .sidebar__footer { padding: 12px 20px; border-top: 1px solid var(--color-border-light); margin-top: auto; }
        .sidebar__menu { list-style: none; }
        .sidebar__section-title { font-size: 12px; font-weight: 800; color: #8c93a6; padding: 16px 20px 6px 20px; text-transform: uppercase; }
        .sidebar__item { display: flex; align-items: center; padding: 10px 20px; color: #555b6e; font-weight: 700; font-size: var(--font-xs); text-decoration: none; gap: 12px; cursor: pointer; transition: background 0.2s; }
        .sidebar__item:hover { background-color: #f0f2f8; }
        .sidebar__item--active { background-color: var(--color-primary); color: white; }
        .sidebar__item--logout { color: #d9381e; }
        .sidebar__item--logout:hover { background-color: #fce8e6; }
        .sidebar__icon { width: 16px; text-align: center; }

        .main { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 1200px; }
        .mobile-header { display: none; justify-content: space-between; align-items: center; padding: 12px 16px; background: white; border: 2px solid var(--color-border); border-radius: 8px; margin-bottom: 12px; }
        .hamburger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 4px; }
        .hamburger__line { width: 24px; height: 3px; background-color: var(--color-primary); border-radius: 2px; }

        .header-bar { background-color: white; border: 2px solid var(--color-border); border-radius: 4px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .header-bar::before { content: ''; position: absolute; left: 12px; top: 12px; bottom: 12px; width: 4px; background-color: #e2cb6b; border-radius: 2px; }
        .header-bar__title-group { padding-left: 12px; }
        .header-bar__title { font-family: 'Fredoka One', cursive, sans-serif; font-size: var(--font-xxl); color: var(--color-primary); line-height: 1; text-transform: uppercase; }
        .header-bar__subtitle { font-size: var(--font-xs); font-weight: 800; color: var(--color-primary); margin-top: 4px; display: flex; gap: 20px; }
        .header-bar__actions { display: flex; gap: 10px; align-items: center; }

        .btn-action { background: white; border: 2px solid var(--color-primary); color: var(--color-primary); font-weight: 800; font-size: var(--font-xs); padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn-action--logout { background-color: #fce8e6; border-color: #d9381e; color: #d9381e; }
        .btn-action--danger { background-color: #fee2e2; border-color: #dc2626; color: #dc2626; }
        .btn-diff { background: white; border: 2px solid var(--color-primary); color: var(--color-primary); font-weight: 800; font-size: var(--font-xs); padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn-diff.active { background-color: var(--color-primary); color: white; }

        .admin-panel { background: #fffdf0; border: 2px dashed #d99f26; border-radius: 4px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .admin-panel__title { font-weight: 800; font-size: var(--font-xs); color: #b89117; text-transform: uppercase; width: 100%; margin-bottom: 4px; }
        .admin-panel__form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .admin-panel__input { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: var(--font-xs); outline: none; }
        .btn-admin { background: #3b52a4; color: white; border: none; font-weight: 800; font-size: var(--font-xs); padding: 7px 12px; border-radius: 4px; cursor: pointer; }

        .controls-card { background: white; border: 2px solid var(--color-border); border-radius: 4px; padding: 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .btn-group { display: flex; border: 2px solid var(--color-primary); border-radius: 4px; overflow: hidden; }
        .btn-toggle { padding: 8px 16px; font-weight: 800; font-size: var(--font-xs); border: none; background: white; color: var(--color-primary); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-toggle--active { background-color: var(--color-primary); color: white; }

        .search-box { flex-grow: 1; max-width: 300px; position: relative; }
        .search-box__input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid #d1d5db; background-color: #f7f6f0; border-radius: 4px; font-size: var(--font-sm); outline: none; }
        .search-box__icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; }

        .event-badge { margin-left: auto; background-color: var(--color-yellow-bg); border: 1px solid var(--color-yellow-border); padding: 6px 12px; border-radius: 4px; display: flex; align-items: center; gap: 8px; font-size: var(--font-xs); font-weight: 800; color: var(--color-yellow-text); }
        .event-badge__count { color: #d9381e; font-size: var(--font-md); font-weight: 800; }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid var(--color-border); border-radius: 4px; background: white; overflow: hidden; }
        .kpi-card { padding: 12px 16px; border-right: 1px solid var(--color-border-light); background-color: #f4f6fb; }
        .kpi-card:last-child { border-right: none; background-color: var(--color-yellow-bg); }
        .kpi-card__label { font-size: 10px; font-weight: 800; color: #8c93a6; text-transform: uppercase; margin-bottom: 4px; }
        .kpi-card__value { font-size: var(--font-xl); font-weight: 800; color: var(--color-primary); }

        .table-card { background: white; border: 2px solid var(--color-border); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: var(--font-sm); }
        .data-table th { background-color: #eef2f9; padding: 12px 16px; font-size: 11px; font-weight: 800; color: #71788e; text-transform: uppercase; border-bottom: 1px solid var(--color-border-light); white-space: nowrap; }
        .data-table td { padding: 10px 16px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; font-weight: 700; color: #4a5060; }
        .data-table tfoot td { background-color: #f8f9fa; border-top: 2px solid var(--color-border-light); padding: 12px 16px; font-size: var(--font-xs); font-weight: 800; color: #8c93a6; }

        .data-table tr.rank-1 { background-color: #fffdf5; }
        .data-table tr.rank-2 { background-color: #faf9f5; }
        .data-table tr.rank-3 { background-color: #fcfbf7; }

        .col-rank { width: 50px; text-align: center; color: #a0a6b5; }
        .col-name { font-weight: 800; color: #2b3044; }
        .col-attended { width: 90px; text-align: center; font-size: var(--font-md); font-weight: 800; }
        .col-event { width: 85px; text-align: center; }
        .col-actions { width: 70px; text-align: center; }

        .attended-high { color: #2563eb; }
        .attended-mid { color: #b89117; }
        .attended-low { color: #dc2626; }

        .vs-avg-pos { color: #2563eb; font-weight: 800; }
        .vs-avg-neg { color: #dc2626; font-weight: 800; }

        .diff-green { color: #16a34a; font-weight: 850; font-size: 12px; display: inline-flex; align-items: center; gap: 2px; }
        .diff-red { color: #dc2626; font-weight: 850; font-size: 12px; display: inline-flex; align-items: center; gap: 2px; }
        .diff-yellow { color: #ca8a04; font-weight: 850; font-size: 12px; display: inline-flex; align-items: center; gap: 2px; }

        .check-toggle { cursor: pointer; padding: 4px 8px; border-radius: 4px; user-select: none; }
        .check-icon { color: var(--color-primary); font-weight: 800; font-size: 14px; }
        .cross-icon { color: #ccc; font-weight: bold; }
        .editable-num { cursor: pointer; border-bottom: 1px dashed var(--color-primary); }

        .progress-bar { height: 8px; width: 100%; background-color: #eef0f5; border-radius: 4px; overflow: hidden; }
        .progress-bar__fill { height: 100%; border-radius: 4px; }
        .progress-bar__fill.high { background-color: #2563eb; } 
        .progress-bar__fill.mid { background-color: #eab308; }  
        .progress-bar__fill.low { background-color: #dc2626; }  

        .ranking-cards-list { display: flex; flex-direction: column; gap: 10px; }
        .ranking-card { background-color: #fdfcf7; border: 2px solid #d5cbac; border-radius: 4px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        .ranking-card--rank-1 { border-color: #d99f26; background-color: #fffdf5; }
        .ranking-card--rank-2 { border-color: #a8a3c0; background-color: #ffffff; }
        .ranking-card--rank-3 { border-color: #c28859; background-color: #fffaf5; }
        .ranking-card__left { display: flex; align-items: center; gap: 16px; min-width: 220px; }
        .ranking-card__badge { font-size: 14px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 4px; background: #eef2f9; color: var(--color-primary); }
        .ranking-card--rank-1 .ranking-card__badge { background: #f3a808; color: white; }
        .ranking-card--rank-2 .ranking-card__badge { background: #a8a3c0; color: white; }
        .ranking-card--rank-3 .ranking-card__badge { background: #c28859; color: white; }
        .ranking-card__name { font-weight: 800; font-size: var(--font-md); color: #2b3044; }
        .ranking-card__subtext { font-size: var(--font-xs); color: #8c93a6; font-weight: 600; }
        .ranking-card__right { display: flex; align-items: center; gap: 20px; flex-grow: 1; justify-content: flex-end; max-width: 580px; }
        .ranking-card__bar-wrapper { flex-grow: 1; max-width: 160px; }

        .btn-icon-action { background: none; border: none; cursor: pointer; padding: 2px 4px; font-size: 13px; font-weight: 800; color: #dc2626; }
        .btn-icon-action:hover { opacity: 0.8; }

        .generic-view-card { background: white; border: 2px solid var(--color-border); border-radius: 4px; padding: 30px; }
        .generic-view-card h2 { color: var(--color-primary); font-family: 'Fredoka One', cursive, sans-serif; margin-bottom: 12px; }

        @media (max-width: 1024px) {
            .app { flex-direction: column; }
            .mobile-header { display: flex; }
            .sidebar { position: fixed; top: 0; left: 0; height: 100vh; transform: translateX(-100%); }
            .sidebar--open { transform: translateX(0); }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="login-page" id="loginScreen">
        <header class="login-header"></header>
        <main class="login-main">
            <section class="login-card">
                <div class="login-card__logo-wrapper">
                    <div class="login-card__logo-circle">
                        <span class="login-card__logo-text">娜美</span>
                    </div>
                    <span class="login-card__logo-star">✦</span>
                </div>
                <h1 class="login-card__title">Alliance Management Tool</h1>
                <button type="button" class="login-card__button" id="btnOpenLoginModal">LOG IN</button>
                <button type="button" class="login-card__guest-link" id="btnOpenCreateAccountModal">Create Account</button>
                <button type="button" class="login-card__guest-link" id="btnGuestAccess">Proceed as Guest</button>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-card">
            <h3>System Login</h3>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <div class="modal-card-btns">
                <button class="btn-action" id="btnCancelModal">Cancel</button>
                <button class="btn-admin" id="btnSubmitLogin">Login</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="createAccountModal">
        <div class="modal-card">
            <h3>Create New Account</h3>
            <input type="text" id="newAccUser" placeholder="Choose Username">
            <input type="password" id="newAccPass" placeholder="Choose Password">
            <div id="newAccRoleInfo" style="font-size: 12px; color: #62697b; margin-bottom: 12px; font-weight: 600;">
                New accounts are registered as Members by default.
            </div>
            <div class="modal-card-btns">
                <button class="btn-action" onclick="document.getElementById('createAccountModal').style.display='none'">Cancel</button>
                <button class="btn-admin" id="btnSubmitCreateAccount">Register</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="roleAssignModal">
        <div class="modal-card">
            <h3>Manage User Roles</h3>
            <select id="targetAccountSelect" style="margin-bottom: 12px;"></select>
            <select id="targetRoleSelect" style="margin-bottom: 12px;">
                <option value="member">Member</option>
                <option value="management">Management</option>
                <option value="admin">Admin</option>
            </select>
            <div class="modal-card-btns">
                <button class="btn-action" onclick="document.getElementById('roleAssignModal').style.display='none'">Cancel</button>
                <button class="btn-admin" id="btnSubmitRoleAssign">Save Changes</button>
            </div>
        </div>
    </div>

    <div class="app" id="appDashboard">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header"><div class="sidebar__logo">娜美</div></div>
            <div class="sidebar__user">
                <div class="sidebar__user-avatar" id="userAvatarIcon">U</div>
                <div>
                    <div id="userRoleDisplay" style="font-size: 11px; text-transform: uppercase;">USERNAME</div>
                    <div id="userPermissionBadge" style="font-size: 9px; color: #8c93a6;">Role</div>
                </div>
            </div>
            <nav class="sidebar__nav">
                <ul class="sidebar__menu">
                    <li><a class="sidebar__item sidebar__item--active" data-view="home"><span class="sidebar__icon">|</span> HOME</a></li>
                    <li><a class="sidebar__item" data-view="notice"><span class="sidebar__icon">|</span> NOTICE</a></li>
                    <li><a class="sidebar__item" data-view="board"><span class="sidebar__
