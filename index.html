<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopy's Playground - Alliance Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fredoka+One&family=Montserrat:wght@600;700;800&family=Noto+Sans+SC:wght@900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --login-bg: #ffffff;
            --login-primary-blue: #324796;
            --login-light-blue: #c3d2f8;
            --login-text-title: #2d4187;
            --login-text-guest: #4f63a8;
            --login-btn-bg: #f3a808;
            --login-btn-hover: #e29a00;
            --login-btn-text: #ffffff;
            --login-star: #f3a808;

            --color-bg-main: #f5f4ef;
            --color-bg-card: #ffffff;
            --color-bg-sidebar: #ffffff;
            --color-primary: #3b52a4;
            --color-primary-light: #eceff8;
            --color-text-dark: #2b3044;
            --color-text-muted: #8c93a6;
            --color-text-light: #a0a6b5;
            --color-border: #3b52a4;
            --color-border-light: #e2e5ed;
            --color-yellow-bg: #fffdf0;
            --color-yellow-border: #e2cb6b;
            --color-yellow-text: #b89117;
            --color-gold: #f3a808;

            --font-family-base: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-family-title: 'Cinzel', serif;
            --font-family-logo: 'Noto Sans SC', sans-serif;

            --font-xs: 11px;
            --font-sm: 13px;
            --font-md: 15px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-xxl: 28px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--color-bg-main); color: var(--color-text-dark); min-height: 100vh; }

        /* LOGIN SCREEN */
        .login-page { display: flex; flex-direction: column; min-height: 100vh; background-color: var(--login-bg); font-family: var(--font-family-base); }
        .login-header { width: 100%; padding: 16px 24px; display: flex; justify-content: flex-end; align-items: center; }
        .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-card { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 480px; width: 100%; }
        .login-card__logo-wrapper { position: relative; width: 180px; height: 180px; margin-bottom: 32px; display: flex; justify-content: center; align-items: center; }
        .login-card__logo-circle { width: 100%; height: 100%; border-radius: 50%; background-color: var(--login-light-blue); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .login-card__logo-text { font-family: var(--font-family-logo); font-size: 80px; font-weight: 900; color: var(--login-primary-blue); line-height: 1; letter-spacing: -4px; user-select: none; }
        .login-card__logo-star { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); color: var(--login-star); font-size: 38px; line-height: 1; z-index: 2; }
        .login-card__title { font-family: var(--font-family-title); font-size: 22px; font-weight: 700; color: var(--login-text-title); letter-spacing: 1.5px; margin-bottom: 32px; text-transform: uppercase; }
        .login-card__button { background-color: var(--login-btn-bg); color: var(--login-btn-text); border: none; border-radius: 10px; padding: 14px 0; width: 180px; font-family: var(--font-family-base); font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 16px; transition: background 0.2s; }
        .login-card__button:hover { background-color: var(--login-btn-hover); }
        .login-card__guest-link { background: none; border: none; color: var(--login-text-guest); font-family: var(--font-family-base); font-size: 14px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-bottom: 12px; }
        .login-card__guest-link:hover { text-decoration: underline; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: white; padding: 24px; border-radius: 8px; width: 100%; max-width: 360px; border: 2px solid var(--color-primary); }
        .modal-card h3 { margin-bottom: 12px; color: var(--color-primary); font-size: 16px; }
        .modal-card input, .modal-card select, .modal-card textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .modal-card-btns { display: flex; justify-content: flex-end; gap: 8px; }
        .login-error-msg { color: #dc2626; font-size: 12px; font-weight: 700; margin-bottom: 10px; display: none; text-align: left; }

        /* DASHBOARD */
        .app { display: none; width: 100%; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--color-bg-sidebar); border-right: 2px solid var(--color-border); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; z-index: 100; }
        .sidebar__header { padding: 20px; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid var(--color-border); }
        .sidebar__logo { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #a5c7f9, #2d55b8); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 24px; }
        .sidebar__user { padding: 16px 20px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: var(--font-sm); color: #62697b; border-bottom: 1px solid var(--color-border-light); }
        .sidebar__user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .sidebar__nav { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding-bottom: 20px; flex-grow: 1; }
        .sidebar__footer { padding: 12px 20px; border-top: 1px solid var(--color-border-light); margin-top: auto; }
        .sidebar__menu { list-style: none; }
        .sidebar__section-title { font-size: 12px; font-weight: 800; color: #8c93a6; padding: 16px 20px 6px 20px; text-transform: uppercase; }
        .sidebar__item { display: flex; align-items: center; padding: 10px 20px; color: #555b6e; font-weight: 700; font-size: var(--font-xs); text-decoration: none; gap: 12px; cursor: pointer; transition: background 0.2s; }
        .sidebar__item:hover { background-color: #f0f2f8; }
        .sidebar__item--active { background-color: var(--color-primary); color: white; }
        .sidebar__item--logout { color: #d9381e; }
        .sidebar__item--logout:hover { background-color: #fce8e6; }
        .sidebar__icon { width: 16px; text-align: center; }

        .main { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 1200px; }
        .mobile-header { display: none; justify-content: space-between; align-items: center; padding: 12px 16px; background: white; border: 2px solid var(--color-border); border-radius: 8px; margin-bottom: 12px; }
        .hamburger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 4px; }
        .hamburger__line { width: 24px; height: 3px; background-color: var(--color-primary); border-radius: 2px; }

        .header-bar { background-color: white; border: 2px solid var(--color-border); border-radius: 4px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .header-bar::before { content: ''; position: absolute; left: 12px; top: 12px; bottom: 12px; width: 4px; background-color: #e2cb6b; border-radius: 2px; }
        .header-bar__title-group { padding-left: 12px; }
        .header-bar__title { font-family: 'Fredoka One', cursive, sans-serif; font-size: var(--font-xxl); color: var(--color-primary); line-height: 1; text-transform: uppercase; }
        .header-bar__subtitle { font-size: var(--font-xs); font-weight: 800; color: var(--color-primary); margin-top: 4px; display: flex; gap: 20px; }
        .header-bar__actions { display: flex; gap: 10px; align-items: center; }

        .btn-action { background: white; border: 2px solid var(--color-primary); color: var(--color-primary); font-weight: 800; font-size: var(--font-xs); padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn-action--logout { background-color: #fce8e6; border-color: #d9381e; color: #d9381e; }
        .btn-diff { background: white; border: 2px solid var(--color-primary); color: var(--color-primary); font-weight: 800; font-size: var(--font-xs); padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn-diff.active { background-color: var(--color-primary); color: white; }

        .admin-panel { background: #fffdf0; border: 2px dashed #d99f26; border-radius: 4px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .admin-panel__title { font-weight: 800; font-size: var(--font-xs); color: #b89117; text-transform: uppercase; width: 100%; margin-bottom: 4px; }
        .admin-panel__form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .admin-panel__input { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: var(--font-xs); outline: none; }
        .btn-admin { background: #3b52a4; color: white; border: none; font-weight: 800; font-size: var(--font-xs); padding: 7px 12px; border-radius: 4px; cursor: pointer; }

        .controls-card { background: white; border: 2px solid var(--color-border); border-radius: 4px; padding: 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .btn-group { display: flex; border: 2px solid var(--color-primary); border-radius: 4px; overflow: hidden; }
        .btn-toggle { padding: 8px 16px; font-weight: 800; font-size: var(--font-xs); border: none; background: white; color: var(--color-primary); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-toggle--active { background-color: var(--color-primary); color: white; }

        .search-box { flex-grow: 1; max-width: 300px; position: relative; }
        .search-box__input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid #d1d5db; background-color: #f7f6f0; border-radius: 4px; font-size: var(--font-sm); outline: none; }
        .search-box__icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; }

        .event-badge { margin-left: auto; background-color: var(--color-yellow-bg); border: 1px solid var(--color-yellow-border); padding: 6px 12px; border-radius: 4px; display: flex; align-items: center; gap: 8px; font-size: var(--font-xs); font-weight: 800; color: var(--color-yellow-text); }
        .event-badge__count { color: #d9381e; font-size: var(--font-md); font-weight: 800; }
