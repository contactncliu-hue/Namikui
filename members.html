<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Gold - Loopy's Playground</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fredoka+One&family=Montserrat:wght@600;700;800&family=Noto+Sans+SC:wght@900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg-main: #f5f4ef;
        --color-primary: #3b52a4;
        --color-primary-dark: #2d3a91;
        --color-text-dark: #2b3044;
        --color-text-muted: #8c93a6;
        --color-border-light: #e2e5ed;
        --color-gold: #f3a808;
        --color-gold-bg: #fffdf0;
        --color-a: #c0392b;
        --color-b: #3b52a4;
        --color-unassigned: #c9ccd6;
        --color-attended: #1f9d55;
        --color-not-attended: #d9381e;
        --color-sub: #c8e0dd;
        --color-main: #ffb000;

        --font-family-base: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Open Sans', sans-serif;
        background-color: var(--color-bg-main);
        color: var(--color-text-dark);
        min-height: 100vh;
        padding-top: 6px;
    }

    .top-accent-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 6px;
        background-color: var(--color-primary-dark);
        z-index: 200;
    }

    .save-status {
        position: fixed;
        top: 14px; right: 14px;
        z-index: 300;
        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 11px;
        padding: 6px 12px;
        border-radius: 4px;
        display: none;
    }
    .save-status--saving { display: block; background: #eef2f9; color: var(--color-primary); border: 1px solid var(--color-primary); }
    .save-status--error { display: block; background: #fce8e6; color: #d9381e; border: 1px solid #d9381e; }
    .save-status--ok { display: block; background: #e6f4ea; color: #1f9d55; border: 1px solid #1f9d55; }

    .page-wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px 60px;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-family-base);
        font-size: 12px;
        font-weight: 800;
        color: var(--color-primary);
        text-decoration: none;
        margin-bottom: 16px;
        cursor: pointer;
    }
    .back-link:hover { text-decoration: underline; }

    .page-header { margin-bottom: 20px; }
    .page-header__title {
        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -1px;
        color: var(--color-primary-dark);
        text-transform: uppercase;
    }
    .page-header__subtitle {
        font-family: var(--font-family-base);
        font-weight: 700;
        font-size: 14px;
        color: var(--color-text-muted);
        margin-top: 4px;
    }

    /* Toolbar */
    .toolbar-card {
        background: white;
        border: 2px solid var(--color-primary);
        border-radius: 6px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }
    .toolbar-card__label {
        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 12px;
        color: white;
        background: var(--color-primary);
        padding: 8px 16px;
        border-radius: 4px;
        letter-spacing: 0.5px;
    }
    .search-box { flex-grow: 1; max-width: 320px; position: relative; }
    .search-box input {
        width: 100%;
        padding: 9px 12px 9px 32px;
        border: 1px solid #d1d5db;
        background-color: #f7f6f0;
        border-radius: 4px;
        font-size: 13px;
        font-family: var(--font-family-base);
        outline: none;
    }
    .search-box__icon {
        position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
        color: #9ca3af; font-size: 13px;
    }
    .btn-gold {
        margin-left: auto;
        background-color: var(--color-gold-bg);
        border: 2px solid var(--color-gold);
        color: var(--color-gold);
        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.5px;
        padding: 10px 18px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s;
    }
    .btn-gold:hover { background-color: var(--color-gold); color: white; }

    /* Legend */
    .legend-row {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        font-family: var(--font-family-base);
        font-weight: 700;
        font-size: 12px;
        color: var(--color-text-dark);
        margin-bottom: 16px;
        padding: 0 4px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-hint { color: var(--color-text-muted); font-weight: 600; font-size: 11px; width: 100%; margin-top: -4px; }

    .slot-badge {
        width: 24px; height: 24px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 11px;
        flex-shrink: 0;
    }
    .slot-badge--a { border: 2px solid var(--color-a); color: var(--color-a); background: white; }
    .slot-badge--b { border: 2px solid var(--color-b); color: var(--color-b); background: white; }
    .slot-badge--unassigned { border: 2px dashed var(--color-unassigned); background: white; }

    .status-badge-legend {
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
    }

    /* Table */
    .table-card {
        background: white;
        border: 2px solid var(--color-primary);
        border-radius: 6px;
        overflow: hidden;
    }
    .table-wrapper { overflow-x: auto; }
    table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-family-base);
    }
    thead th {
        background-color: #e9ecf7;
        padding: 14px 12px;
        font-size: 11px;
        font-weight: 800;
        color: var(--color-primary-dark);
        text-transform: uppercase;
        border-bottom: 2px solid var(--color-primary);
        white-space: nowrap;
        text-align: center;
    }
    thead th.col-member { text-align: left; padding-left: 20px; }
    thead th .date-label { font-size: 13px; font-weight: 800; color: var(--color-text-dark); }
    thead th .week-label { font-size: 9px; font-weight: 700; color: var(--color-text-muted); text-transform: none; margin-top: 2px; }
    thead th .remove-date-btn {
        display: inline-block;
        margin-top: 4px;
        color: #d9381e;
        cursor: pointer;
        font-size: 10px;
        font-weight: 800;
    }

    tbody td {
        padding: 12px;
        border-bottom: 1px solid var(--color-border-light);
        text-align: center;
        vertical-align: middle;
    }
    tbody td.col-rank { color: var(--color-text-muted); font-weight: 700; width: 40px; }
    tbody td.col-member { text-align: left; padding-left: 20px; font-weight: 800; color: var(--color-text-dark); }
    tbody td.col-penalty { font-weight: 800; }

    .cell-stack { display: flex; flex-direction: column; align-items: center; gap: 5px; }

    .slot-btn {
        width: 30px; height: 30px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.1s;
    }
    .slot-btn:active { transform: scale(0.92); }
    .slot-btn--a { border: 2px solid var(--color-a); color: var(--color-a); background: white; }
    .slot-btn--b { border: 2px solid var(--color-b); color: var(--color-b); background: white; }
    .slot-btn--unassigned { border: 2px dashed var(--color-unassigned); background: white; color: transparent; }
    .slot-btn--readonly { cursor: default; }

    .attend-pill {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.3px;
        padding: 3px 8px;
        border-radius: 10px;
        cursor: pointer;
        user-select: none;
        text-transform: uppercase;
        white-space: nowrap;
    }
    .attend-pill--yes { background: #e6f4ea; color: var(--color-attended); border: 1px solid var(--color-attended); }
    .attend-pill--no { background: #fce8e6; color: var(--color-not-attended); border: 1px solid var(--color-not-attended); }
    .attend-pill--readonly { cursor: default; }

    .role-pill {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.3px;
        padding: 3px 8px;
        border-radius: 10px;
        cursor: pointer;
        user-select: none;
        text-transform: uppercase;
        white-space: nowrap;
    }
    .role-pill--main { background: var(--color-main); color: #3d2c00; border: 1px solid #c98c00; }
    .role-pill--sub { background: var(--color-sub); color: #1e3a38; border: 1px solid #95b8b5; }
    .role-pill--none { background: #f0f1f5; color: #a0a5b8; border: 1px dashed #d1d5db; }
    .role-pill--readonly { cursor: default; }

    tfoot td {
        background-color: #f4f6fb;
        border-top: 2px solid var(--color-primary);
        padding: 12px;
        font-size: 11px;
        font-weight: 800;
        color: var(--color-text-muted);
        text-align: center;
    }
    tfoot td.col-member { text-align: left; padding-left: 20px; color: var(--color-primary-dark); }
    tfoot .ab-count-a { color: var(--color-a); }
    tfoot .ab-count-b { color: var(--color-b); }

    .page-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        font-family: var(--font-family-base);
        font-size: 10px;
        font-weight: 700;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0 4px;
    }

    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--color-text-muted);
        font-family: var(--font-family-base);
        font-weight: 700;
        font-size: 13px;
    }

    @media (max-width: 640px) {
        .page-header__title { font-size: 26px; }
        .toolbar-card { flex-direction: column; align-items: stretch; }
        .btn-gold { margin-left: 0; }
        .search-box { max-width: none; }
    }
</style>
</head>
<body>
<div class="top-accent-bar"></div>
<div class="save-status" id="saveStatus"></div>

<div class="page-wrap">
    <a class="back-link" href="index.html">← Back to Dashboard</a>

    <div class="page-header">
        <div class="page-header__title">Members</div>
        <div class="page-header__subtitle" id="pageSubtitle">0 members total</div>
    </div>

    <div class="toolbar-card">
        <span class="toolbar-card__label">ROSTER</span>
        <div class="search-box">
            <span class="search-box__icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search member...">
        </div>
        <button class="btn-gold" id="btnAddMember" style="display: none;">+ ADD MEMBER</button>
    </div>

    <div class="table-card">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr id="tableHeaderRow">
                        <th class="col-rank">#</th>
                        <th class="col-member">Member Name</th>
                        <th>Role</th>
                        <th>Joined Date</th>
                        <th id="actionsHeader" style="display: none;">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="page-footer">
        <span>♦ Loopy's Playground · Alliance Management Tool</span>
        <span id="shownCount">0/0 members shown</span>
    </div>
</div>

<script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://sqrrfslqwcgpsmzdovru.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_rb70-VY2GstWzdoXmoUkwg_Iw3EiqFO';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const currentUser = {
        username: localStorage.getItem('amt_username') || null,
        role: localStorage.getItem('amt_userRole') || null
    };

    if (!currentUser.role) {
        window.location.href = 'index.html';
    }

    const isManagementOrAdmin = currentUser.role === 'admin' || currentUser.role === 'management';

    // --- SAVE STATUS INDICATOR ---
    const saveStatusEl = document.getElementById('saveStatus');
    let saveStatusTimer = null;
    function showSaveStatus(kind, text) {
        clearTimeout(saveStatusTimer);
        saveStatusEl.className = 'save-status save-status--' + kind;
        saveStatusEl.innerText = text;
        if (kind !== 'error') {
            saveStatusTimer = setTimeout(() => { saveStatusEl.className = 'save-status'; }, 1500);
        }
    }

    // --- STATE ---
    let members = [];

    async function loadData() {
        try {
            const { data, error } = await db.from('app_data').select('*');
            if (error) throw error;
            if (data) {
                data.forEach(row => {
                    if (row.key === 'members') members = row.value || [];
                });
            }
        } catch (err) {
            console.error('Error loading Members data:', err.message || err);
            alert('Could not load data from the cloud: ' + (err.message || err));
        }
        render();
    }

    async function saveMembers() {
        showSaveStatus('saving', 'Saving…');
        try {
            const { error } = await db.from('app_data')
                .upsert({ id: 1, key: 'members', value: members }, { onConflict: 'id' });
            if (error) {
                console.error('Save Error (Members):', error.message, error);
                showSaveStatus('error', 'Save failed: ' + error.message);
                alert('Could not save to the cloud:\n' + error.message);
                return;
            }
            showSaveStatus('ok', 'Saved');
        } catch (err) {
            console.error('CRITICAL ERROR saving Members:', err.message || err);
            showSaveStatus('error', 'Save failed');
            alert('Could not save to the cloud:\n' + (err.message || err));
        }
    }

    // --- RENDER ---
    function render() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = members.filter(m => m.name.toLowerCase().includes(query));

        document.getElementById('pageSubtitle').innerText = `${members.length} members total`;
        document.getElementById('shownCount').innerText = `${filtered.length}/${members.length} members shown`;
        
        const addBtn = document.getElementById('btnAddMember');
        const actionsHeader = document.getElementById('actionsHeader');
        if (addBtn) addBtn.style.display = isManagementOrAdmin ? 'inline-block' : 'none';
        if (actionsHeader) actionsHeader.style.display = isManagementOrAdmin ? 'table-cell' : 'none';

        renderBody(filtered);
    }

    function renderBody(filtered) {
        const body = document.getElementById('tableBody');
        body.innerHTML = '';

        if (filtered.length === 0) {
            const colSpan = isManagementOrAdmin ? 5 : 4;
            body.innerHTML = `<tr><td colspan="${colSpan}" class="empty-state">No members found.</td></tr>`;
            return;
        }

        filtered.forEach((member, index) => {
            const actionsCell = isManagementOrAdmin ? `
                <td>
                    <button class="btn-gold" style="padding: 4px 8px; font-size: 10px;" onclick="removeMember('${member.id}')">Remove</button>
                ` : '';

            body.insertAdjacentHTML('beforeend', `
                <tr>
                    <td class="col-rank">${index + 1}</td>
                    <td class="col-member">${member.name}</td>
                    <td><span class="role-pill role-pill--sub">${member.role || 'Member'}</span></td>
                    <td style="color: var(--color-text-muted); font-weight: 600; font-size: 12px;">${member.joinedDate || 'N/A'}</td>
                    ${actionsCell}
                </tr>
            `);
        });
    }

    window.removeMember = async function(memberId) {
        if (!confirm('Are you sure you want to remove this member?')) return;
        members = members.filter(m => m.id !== memberId);
        await saveMembers();
        render();
    };

    document.getElementById('searchInput').addEventListener('input', render);

    loadData();
</script>
</body>
</html>
