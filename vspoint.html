<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopy's Playground - VS Points Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fredoka+One&family=Montserrat:wght@600;700;800&family=Noto+Sans+SC:wght@900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-main: #f5f4ef;
            --color-bg-card: #ffffff;
            --color-bg-sidebar: #ffffff;
            --color-primary: #3b52a4;
            --color-primary-light: #eceff8;
            --color-text-dark: #2b3044;
            --color-text-muted: #8c93a6;
            --color-border: #3b52a4;
            --color-border-light: #e2e5ed;
            --color-yellow-bg: #fffdf0;
            --color-yellow-border: #e2cb6b;
            --color-yellow-text: #b89117;
            --color-gold: #f3a808;

            --font-family-base: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-family-title: 'Cinzel', serif;
            --font-family-logo: 'Noto Sans SC', sans-serif;

            --font-xs: 11px;
            --font-sm: 13px;
            --font-md: 15px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-xxl: 28px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--color-bg-main); color: var(--color-text-dark); min-height: 100vh; display: flex; }

        /* SIDEBAR */
        .sidebar { width: 260px; background-color: var(--color-bg-sidebar); border-right: 2px solid var(--color-border); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; height: 100vh; z-index: 100; }
        .sidebar__header { padding: 20px; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid var(--color-border); }
        .sidebar__logo { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #a5c7f9, #2d55b8); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 24px; }
        .sidebar__user { padding: 16px 20px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: var(--font-sm); color: #62697b; border-bottom: 1px solid var(--color-border-light); }
        .sidebar__user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .sidebar__nav { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding-bottom: 20px; flex-grow: 1; }
        .sidebar__footer { padding: 12px 20px; border-top: 1px solid var(--color-border-light); margin-top: auto; }
        .sidebar__menu { list-style: none; }
        .sidebar__item { display: flex; align-items: center; padding: 10px 20px; color: #555b6e; font-weight: 700; font-size: var(--font-xs); text-decoration: none; gap: 12px; cursor: pointer; transition: background 0.2s; }
        .sidebar__item:hover { background-color: #f0f2f8; }
        .sidebar__item--active { background-color: var(--color-primary); color: white; }
        .sidebar__item--logout { color: #d9381e; }
        .sidebar__item--logout:hover { background-color: #fce8e6; }
        .sidebar__icon { width: 16px; text-align: center; }

        /* MAIN CONTENT */
        .main { flex-grow: 1; margin-left: 260px; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: calc(100% - 260px); }

        .generic-view-card { background: white; border: 2px solid var(--color-border); border-radius: 4px; padding: 30px; }
        .generic-view-card h2 { color: var(--color-primary); font-family: 'Fredoka One', cursive, sans-serif; margin-bottom: 12px; }

        .admin-panel { background: #fffdf0; border: 2px dashed #d99f26; border-radius: 4px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .admin-panel__title { font-weight: 800; font-size: var(--font-xs); color: #b89117; text-transform: uppercase; width: 100%; margin-bottom: 4px; }
        .admin-panel__form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .admin-panel__input { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: var(--font-xs); outline: none; }
        .btn-admin { background: #3b52a4; color: white; border: none; font-weight: 800; font-size: var(--font-xs); padding: 7px 12px; border-radius: 4px; cursor: pointer; }

        .table-card { background: white; border: 2px solid var(--color-border); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: var(--font-sm); }
        .data-table th { background-color: #eef2f9; padding: 12px 16px; font-size: 11px; font-weight: 800; color: #71788e; text-transform: uppercase; border-bottom: 1px solid var(--color-border-light); white-space: nowrap; }
        .data-table td { padding: 10px 16px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; font-weight: 700; color: #4a5060; }
        
        .data-table tr.rank-1 { background-color: #fffdf5; }
        .data-table tr.rank-2 { background-color: #faf9f5; }
        .data-table tr.rank-3 { background-color: #fcfbf7; }

        .col-rank { width: 50px; text-align: center; color: #a0a6b5; }
        .col-name { font-weight: 800; color: #2b3044; }
        .col-actions { width: 70px; text-align: center; }

        .editable-num { cursor: pointer; border-bottom: 1px dashed var(--color-primary); }
        .btn-icon-action { background: none; border: none; cursor: pointer; padding: 2px 4px; font-size: 13px; font-weight: 800; color: #dc2626; }
        .btn-icon-action:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar__header"><div class="sidebar__logo">娜美</div></div>
        <div class="sidebar__user">
            <div class="sidebar__user-avatar" id="userAvatarIcon">U</div>
            <div>
                <div id="userRoleDisplay" style="font-size: 11px; text-transform: uppercase;">USERNAME</div>
                <div id="userPermissionBadge" style="font-size: 9px; color: #8c93a6;">Role</div>
            </div>
        </div>
        <nav class="sidebar__nav">
            <ul class="sidebar__menu">
                <li><a class="sidebar__item" href="index.html"><span class="sidebar__icon">|</span> HOME</a></li>
                <li><a class="sidebar__item" href="members.html"><span class="sidebar__icon">|</span> MEMBERS</a></li>
                <li><a class="sidebar__item" href="blackgold.html"><span class="sidebar__icon">|</span> BLACK GOLD</a></li>
                <li><a class="sidebar__item sidebar__item--active" href="vspoint.html"><span class="sidebar__icon">|</span> VS POINTS</a></li>
            </ul>
        </nav>
        <div class="sidebar__footer">
            <a class="sidebar__item sidebar__item--logout" id="sidebarLogoutBtn"><span class="sidebar__icon">|</span> LOG OUT</a>
        </div>
    </aside>

    <main class="main">
        <div class="generic-view-card" style="margin-bottom: 0;">
            <h2>VS Points Breakdown</h2>
            <p style="margin-bottom: 16px;">VS Point tracker interface logs and high-score rankings synchronized via Supabase.</p>
        </div>

        <div id="vsAdminPanel" class="admin-panel" style="display: none;">
            <div class="admin-panel__title">VS Points Management Tools</div>
            <div class="admin-panel__form">
                <input type="text" class="admin-panel__input" id="newVsWeekInput" placeholder="Week Label (e.g. Sun 07-06)">
                <button class="btn-admin" id="btnAddVsWeek">Add Week Column</button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr id="vsTableHeaderRow">
                            <th class="col-rank">#</th>
                            <th>Fighter Name</th>
                            <th style="text-align: right;">Total Score</th>
                        </tr>
                    </thead>
                    <tbody id="vsTableBody">
                        <tr><td colspan="3" style="text-align: center; color: #8c93a6;">Loading VS points...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://sqrrfslqwcgpsmzdovru.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_rb70-VY2GstWzdoXmoUkwg_Iw3EiqFO';
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = {
            username: localStorage.getItem('amt_username') || 'Guest User',
            role: localStorage.getItem('amt_userRole') || 'guest'
        };

        let vsData = { weeks: [], membersScores: [] };
        let auditLogs = [];

        async function loadDataFromCloud() {
            try {
                const { data, error } = await db.from('app_data').select('*');
                if (error) throw error;
                if (data && data.length > 0) {
                    data.forEach(row => {
                        if (row.key === 'vsData') vsData = row.value || { weeks: [], membersScores: [] };
                        if (row.key === 'auditLogs') auditLogs = row.value || [];
                    });
                }
            } catch (err) {
                console.error('Error loading from cloud:', err);
            }
            render();
        }

        async function saveData() {
            try {
                // Using id: 7 matching the global cloud synchronization schema
                await db.from('app_data').upsert({ id: 7, key: 'vsData', value: vsData }, { onConflict: 'id' });
                await db.from('app_data').upsert({ id: 3, key: 'auditLogs', value: auditLogs }, { onConflict: 'id' });
            } catch (err) {
                console.error('Save error:', err);
            }
        }

        function logAction(actionType, description) {
            const entry = {
                timestamp: new Date().toLocaleString(),
                user: currentUser.username || 'System',
                role: currentUser.role || 'guest',
                type: actionType,
                details: description
            };
            auditLogs.unshift(entry);
            if (auditLogs.length > 50) auditLogs.pop();
            saveData();
        }

        function render() {
            const isManagementOrAdmin = currentUser.role === 'admin' || currentUser.role === 'management';
            document.getElementById('vsAdminPanel').style.display = isManagementOrAdmin ? 'flex' : 'none';

            document.getElementById('userRoleDisplay').innerText = currentUser.username.toUpperCase();
            document.getElementById('userPermissionBadge').innerText = `Role: ${currentUser.role.toUpperCase()}`;
            document.getElementById('userAvatarIcon').innerText = currentUser.username.charAt(0).toUpperCase();

            renderVsPointsTable(isManagementOrAdmin);
        }

        function renderVsPointsTable(isManagementOrAdmin) {
            const headerRow = document.getElementById('vsTableHeaderRow');
            const body = document.getElementById('vsTableBody');
            if (!headerRow || !body) return;

            let hHTML = `<th class="col-rank">#</th><th>Fighter Name</th><th style="text-align: right;">Total Score</th>`;
            if (vsData && vsData.weeks) {
                vsData.weeks.forEach((wk, wIdx) => {
                    hHTML += `<th style="text-align: right;">${wk} ${isManagementOrAdmin ? `<span style="color:#d9381e; cursor:pointer;" onclick="removeVsWeek(${wIdx})">x</span>` : ''}</th>`;
                });
            }
            if (isManagementOrAdmin) hHTML += `<th class="col-actions">Actions</th>`;
            headerRow.innerHTML = hHTML;

            if (!vsData || !vsData.membersScores || vsData.membersScores.length === 0) {
                body.innerHTML = `<tr><td colspan="10" style="text-align: center; color: #8c93a6;">No VS points data recorded yet.</td></tr>`;
                return;
            }

            const scoredList = vsData.membersScores.map(ms => {
                const total = (ms.scores || []).reduce((a, b) => a + (b || 0), 0);
                return { ...ms, totalScore: total };
            });
            scoredList.sort((a, b) => b.totalScore - a.totalScore);

            body.innerHTML = scoredList.map((ms, idx) => {
                const rank = idx + 1;
                let rHTML = `
                    <tr class="${rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''))}">
                        <td class="col-rank">${rank}</td>
                        <td class="col-name">${ms.name}</td>
                        <td style="text-align: right; font-weight: 800; color: var(--color-primary);">${ms.totalScore.toLocaleString()}</td>
                `;

                vsData.weeks.forEach((wk, wIdx) => {
                    const scoreVal = (ms.scores && ms.scores[wIdx] !== undefined) ? ms.scores[wIdx] : 0;
                    rHTML += `
                        <td style="text-align: right;">
                            <span class="${isManagementOrAdmin ? 'editable-num' : ''}" onclick="${isManagementOrAdmin ? `editVsScore(${ms.id}, ${wIdx})` : ''}">${scoreVal.toLocaleString()}</span>
                        </td>
                    `;
                });

                if (isManagementOrAdmin) {
                    rHTML += `<td class="col-actions"><button class="btn-icon-action" onclick="deleteVsMember(${ms.id})">Delete</button></td>`;
                }
                rHTML += `</tr>`;
                return rHTML;
            }).join('');
        }

        window.editVsScore = function(memberId, weekIndex) {
            const ms = vsData.membersScores.find(m => m.id === memberId);
            if (!ms) return;
            const currentVal = ms.scores[weekIndex] || 0;
            const val = prompt(`Update VS score for ${ms.name} on ${vsData.weeks[weekIndex]}:`, currentVal);
            if (val !== null && !isNaN(val)) {
                ms.scores[weekIndex] = parseInt(val, 10);
                logAction('EDIT_VS_SCORE', `Updated VS score for [${ms.name}] on week ${vsData.weeks[weekIndex]} to ${ms.scores[weekIndex]}`);
                saveData();
                render();
            }
        };

        window.deleteVsMember = function(memberId) {
            const ms = vsData.membersScores.find(m => m.id === memberId);
            if (confirm(`Remove ${ms ? ms.name : ''} from VS Points tracker?`)) {
                logAction('DELETE_VS_MEMBER', `Removed VS record for: ${ms ? ms.name : memberId}`);
                vsData.membersScores = vsData.membersScores.filter(m => m.id !== memberId);
                saveData();
                render();
            }
        };

        window.removeVsWeek = function(weekIndex) {
            if (confirm(`Remove week column ${vsData.weeks[weekIndex]}?`)) {
                logAction('DELETE_VS_WEEK', `Removed VS week column: ${vsData.weeks[weekIndex]}`);
                vsData.weeks.splice(weekIndex, 1);
                vsData.membersScores.forEach(ms => {
                    if (ms.scores) ms.scores.splice(weekIndex, 1);
                });
                saveData();
                render();
            }
        };

        document.getElementById('btnAddVsWeek').addEventListener('click', () => {
            const input = document.getElementById('newVsWeekInput');
            const weekLabel = input.value.trim();
            if (!weekLabel) return;
            
            if (!vsData.weeks) vsData.weeks = [];
            vsData.weeks.push(weekLabel);
            
            if (!vsData.membersScores) vsData.membersScores = [];
            vsData.membersScores.forEach(ms => {
                if (!ms.scores) ms.scores = [];
                while (ms.scores.length < vsData.weeks.length) {
                    ms.scores.push(0);
                }
            });

            logAction('ADD_VS_WEEK', `Added VS week column: ${weekLabel}`);
            input.value = '';
            saveData();
            render();
        });

        document.getElementById('sidebarLogoutBtn').addEventListener('click', () => {
            localStorage.removeItem('amt_userRole');
            localStorage.removeItem('amt_username');
            window.location.href = 'index.html';
        });

        window.addEventListener('DOMContentLoaded', loadDataFromCloud);
    </script>
</body>
</html>
