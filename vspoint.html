<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Points - Loopy's Playground</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Fredoka+One&family=Montserrat:wght@600;700;800&family=Noto+Sans+SC:wght@900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg-main: #f5f4ef;
        --color-primary: #3b52a4;
        --color-primary-dark: #2d3a91;
        --color-text-dark: #2b3044;
        --color-text-muted: #8c93a6;
        --color-border-light: #e2e5ed;
        --color-gold: #f3a808;
        --color-gold-bg: #fffdf0;
        --color-not-attended: #d9381e;
        --font-family-base: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Open Sans', sans-serif;
        background-color: var(--color-bg-main);
        color: var(--color-text-dark);
        min-height: 100vh;
        padding-top: 6px;
    }

    .top-accent-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 6px;
        background-color: var(--color-primary-dark);
        z-index: 200;
    }

    .page-wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px 60px;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-family-base);
        font-size: 12px;
        font-weight: 800;
        color: var(--color-primary);
        text-decoration: none;
        margin-bottom: 16px;
        cursor: pointer;
    }
    .back-link:hover { text-decoration: underline; }

    .page-header { margin-bottom: 20px; }
    .page-header__title {
        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -1px;
        color: var(--color-primary-dark);
        text-transform: uppercase;
    }
    .page-header__subtitle {
        font-family: var(--font-family-base);
        font-weight: 700;
        font-size: 14px;
        color: var(--color-text-muted);
        margin-top: 4px;
    }

    /* Toolbar Card */
    .toolbar-card {
        background: white;
        border: 2px solid var(--color-primary);
        border-radius: 6px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }
    .toolbar-card__label {
        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 12px;
        color: white;
        background: var(--color-primary);
        padding: 8px 16px;
        border-radius: 4px;
        letter-spacing: 0.5px;
    }
    .vs-tab-toggles {
        display: flex;
        background: #edf2f7;
        padding: 3px;
        border-radius: 4px;
    }
    .vs-sub-tab {
        border: none;
        padding: 8px 16px;
        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 11px;
        cursor: pointer;
        border-radius: 3px;
        background: transparent;
        color: var(--color-text-muted);
        transition: all 0.15s;
    }
    .vs-sub-tab.active {
        background: var(--color-primary-dark);
        color: white;
    }

    .search-box { flex-grow: 1; max-width: 280px; position: relative; }
    .search-box input {
        width: 100%;
        padding: 9px 12px 9px 32px;
        border: 1px solid #d1d5db;
        background-color: #f7f6f0;
        border-radius: 4px;
        font-size: 13px;
        font-family: var(--font-family-base);
        outline: none;
    }
    .search-box__icon {
        position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
        color: #9ca3af; font-size: 13px;
    }

    .toolbar-actions {
        display: flex;
        gap: 8px;
        margin-left: auto;
    }
    .btn-toolbar {
        background-color: white;
        border: 1px solid #cbd5e0;
        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 11px;
        padding: 9px 14px;
        border-radius: 4px;
        cursor: pointer;
        color: var(--color-text-dark);
        transition: all 0.15s;
    }
    .btn-toolbar:hover { background-color: #f7fafc; border-color: var(--color-primary); }

    /* Legend Row */
    .legend-row {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        font-family: var(--font-family-base);
        font-weight: 700;
        font-size: 12px;
        color: var(--color-text-dark);
        margin-bottom: 16px;
        padding: 0 4px;
    }
    .badge-rank {
        width: 22px; height: 22px;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 50%;
        font-size: 10px;
        font-weight: 800;
        color: white;
    }
    .r1 { background: #d69e2e; }
    .r2 { background: #a0aec0; }
    .r3 { background: #b7791f; }
    .r4 { background: #3182ce; }
    .r5 { background: #e53e3e; }
    .vs-hint { color: var(--color-text-muted); font-weight: 600; font-size: 11px; font-style: italic; }

    /* Table Container */
    .table-card {
        background: white;
        border: 2px solid var(--color-primary);
        border-radius: 6px;
        overflow: hidden;
    }
    .table-wrapper { overflow-x: auto; }
    table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-family-base);
    }
    thead th {
        background-color: #e9ecf7;
        padding: 14px 12px;
        font-size: 11px;
        font-weight: 800;
        color: var(--color-primary-dark);
        text-transform: uppercase;
        border-bottom: 2px solid var(--color-primary);
        white-space: nowrap;
        text-align: center;
    }
    thead th.col-member { text-align: left; padding-left: 20px; }
    thead th .sub-header-text { font-size: 9px; font-weight: 700; color: var(--color-text-muted); text-transform: none; margin-top: 2px; display: block; }

    tbody td {
        padding: 12px;
        border-bottom: 1px solid var(--color-border-light);
        text-align: center;
        vertical-align: middle;
        font-size: 13px;
    }
    tbody td.col-rank { color: var(--color-text-muted); font-weight: 700; width: 40px; }
    tbody td.col-member { text-align: left; padding-left: 20px; font-weight: 800; color: var(--color-text-dark); }

    /* Ranking Cards */
    .ranking-cards-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .ranking-card {
        background: white;
        border: 1px solid var(--color-border-light);
        border-radius: 6px;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--font-family-base);
    }

    .page-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        font-family: var(--font-family-base);
        font-size: 10px;
        font-weight: 700;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0 4px;
    }
</style>
</head>
<body>
<div class="top-accent-bar"></div>

<div class="page-wrap">
    <a class="back-link" href="index.html">← Back to Dashboard</a>

    <div class="page-header">
        <div class="page-header__title">VS Points</div>
        <div class="page-header__subtitle" id="vsSubtitleInfo">Weekly Sunday Tally & Overall Rankings</div>
    </div>

    <div class="toolbar-card">
        <span class="toolbar-card__label">VIEWS</span>
        <div class="vs-tab-toggles">
            <button class="vs-sub-tab active" id="btnWeeklyTable" onclick="switchVsSubTab('weekly')">WEEKLY TABLE</button>
            <button class="vs-sub-tab" id="btnRanking" onclick="switchVsSubTab('ranking')">RANKING</button>
        </div>
        
        <div class="search-box">
            <span class="search-box__icon">🔍</span>
            <input type="text" id="vsSearchInput" placeholder="Search member..." oninput="renderVsPoints()">
        </div>

        <div class="toolbar-actions">
            <button class="btn-toolbar admin-only" id="btnAddWeek" onclick="promptAddVsWeek()" style="display:none;">+ ADD WEEK</button>
            <button class="btn-toolbar admin-only" id="btnImportVs" onclick="document.getElementById('vsScreenshotInput').click()" style="display:none;">📥 IMPORT SCREENSHOT</button>
            <input type="file" id="vsScreenshotInput" accept="image/*" style="display: none;" onchange="handleVsScreenshotImport(event)">
        </div>
    </div>

    <div class="legend-row">
        <div style="display: flex; align-items: center; gap: 6px;">TOP 5:</div>
        <div style="display: flex; align-items: center; gap: 4px;"><span class="badge-rank r1">1</span> 1st</div>
        <div style="display: flex; align-items: center; gap: 4px;"><span class="badge-rank r2">2</span> 2nd</div>
        <div style="display: flex; align-items: center; gap: 4px;"><span class="badge-rank r3">3</span> 3rd</div>
        <div style="display: flex; align-items: center; gap: 4px;"><span class="badge-rank r4">4</span> 4th</div>
        <div style="display: flex; align-items: center; gap: 4px;"><span class="badge-rank r5">5</span> 5th</div>
        <span class="vs-hint">· Admin/Mgmt: Click any cell to edit points. Weekly scores below 12M marked red.</span>
    </div>

    <!-- Weekly Table View -->
    <div id="vsWeeklyTableContainer" class="table-card">
        <div class="table-wrapper">
            <table>
                <thead><tr id="vsTableHeaders"></tr></thead>
                <tbody id="vsTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Ranking View -->
    <div id="vsRankingContainer" class="vs-sub-view" style="display: none;">
        <div class="ranking-cards-list" id="vsRankingCardsList"></div>
    </div>

    <div class="page-footer">
        <span>♦ Loopy's Playground · Alliance Management Tool</span>
        <span id="shownCount">0 members shown</span>
    </div>
</div>

<script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://sqrrfslqwcgpsmzdovru.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_rb70-VY2GstWzdoXmoUkwg_Iw3EiqFO';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const currentUser = {
        username: localStorage.getItem('amt_username') || null,
        role: localStorage.getItem('amt_userRole') || null
    };

    if (!currentUser.role) {
        window.location.href = 'index.html';
    }

    const isManagementOrAdmin = currentUser.role === 'admin' || currentUser.role === 'management';

    // --- STATE ---
    let members = [];
    let vsData = {
        weeks: [],
        membersScores: []
    };
    let currentVsSubTab = 'weekly';

    async function loadData() {
        try {
            const { data, error } = await db.from('app_data').select('*');
            if (error) throw error;
            
            if (data) {
                data.forEach(row => {
                    if (row.key === 'members') members = row.value || [];
                    if (row.key === 'vsData') {
                        // Ensure vsData is correctly structured even if row 7 value is an empty array []
                        if (row.value && !Array.isArray(row.value) && row.value.weeks) {
                            vsData = row.value;
                        }
                    }
                });
            }

            // If vsData is missing proper structure, initialize fields
            if (!vsData.weeks || !Array.isArray(vsData.weeks)) vsData.weeks = [];
            if (!vsData.membersScores || !Array.isArray(vsData.membersScores)) vsData.membersScores = [];

            // Sync members list with vsData to ensure all current roster members appear in VS tracking
            if (members.length > 0 && vsData.membersScores.length === 0) {
                vsData.membersScores = members.map(m => ({
                    id: m.id,
                    name: m.name,
                    scores: vsData.weeks.map(() => 0)
                }));
            } else {
                members.forEach(m => {
                    let existing = vsData.membersScores.find(s => String(s.id) === String(m.id));
                    if (!existing) {
                        vsData.membersScores.push({
                            id: m.id,
                            name: m.name,
                            scores: vsData.weeks.map(() => 0)
                        });
                    } else {
                        existing.name = m.name;
                    }
                });
            }
        } catch (err) {
            console.error('Error loading VS points data:', err.message || err);
        }
        renderVsPoints();
    }

    async function saveData() {
        try {
            await db.from('app_data').upsert({ id: 7, key: 'vsData', value: vsData }, { onConflict: 'id' });
        } catch (err) {
            console.error('CRITICAL ERROR saving VS data:', err.message || err);
        }
    }

    function switchVsSubTab(tab) {
        currentVsSubTab = tab;
        const isWeekly = tab === 'weekly';
        
        document.getElementById('btnWeeklyTable').classList.toggle('active', isWeekly);
        document.getElementById('btnRanking').classList.toggle('active', !isWeekly);
        
        document.getElementById('vsWeeklyTableContainer').style.display = isWeekly ? 'block' : 'none';
        document.getElementById('vsRankingContainer').style.display = !isWeekly ? 'block' : 'none';
        renderVsPoints();
    }

    function renderVsPoints() {
        document.querySelectorAll('.admin-only').forEach(el => {
            el.style.display = isManagementOrAdmin ? 'inline-block' : 'none';
        });

        const searchVal = document.getElementById('vsSearchInput')?.value.toLowerCase() || '';

        if (currentVsSubTab === 'weekly') {
            renderVsWeeklyTable(searchVal);
        } else {
            renderVsRanking(searchVal);
        }
    }

    function renderVsWeeklyTable(filter) {
        const headersTr = document.getElementById('vsTableHeaders');
        const bodyTb = document.getElementById('vsTableBody');
        if (!headersTr || !bodyTb) return;
        
        let headerHTML = `<th class="col-rank">#</th><th class="col-member">Member</th>`;
        vsData.weeks.forEach(wk => {
            headerHTML += `<th>${wk}<span class="sub-header-text">Sunday Tally</span></th>`;
        });
        headersTr.innerHTML = headerHTML;

        const filtered = vsData.membersScores.filter(m => m.name.toLowerCase().includes(filter));
        document.getElementById('shownCount').innerText = `${filtered.length} members shown`;
        
        if (filtered.length === 0) {
            bodyTb.innerHTML = `<tr><td colspan="${2 + vsData.weeks.length}" style="text-align:center; padding:40px; color:var(--color-text-muted); font-weight:700;">No members found.</td></tr>`;
            return;
        }

        let bodyHTML = '';
        filtered.forEach((m, index) => {
            bodyHTML += `<tr><td class="col-rank">${index + 1}</td><td class="col-member">${m.name}</td>`;
            
            vsData.weeks.forEach((wk, wIdx) => {
                const score = m.scores[wIdx] || 0;
                const isBelowThreshold = score < 12000000;
                const formattedScore = score.toLocaleString();
                
                const cellStyle = isBelowThreshold 
                    ? 'background: #fce8e6; color: var(--color-not-attended); font-weight: 800;' 
                    : 'background: #ffffff;';
                    
                bodyHTML += `
                    <td style="${cellStyle} ${isManagementOrAdmin ? 'cursor: pointer;' : ''}" 
                        ${isManagementOrAdmin ? `onclick="editVsScore('${m.id}', ${wIdx})"` : ''}>
                        ${formattedScore}
                    </td>`;
            });
            bodyHTML += `</tr>`;
        });
        bodyTb.innerHTML = bodyHTML;
    }

    function renderVsRanking(filter) {
        const container = document.getElementById('vsRankingCardsList');
        if (!container) return;
        
        const rankedList = [...vsData.membersScores].map(m => {
            const total = m.scores.reduce((a, b) => a + b, 0);
            const mostRecent = m.scores.length > 0 ? (m.scores[m.scores.length - 1] || 0) : 0;
            return { ...m, total, mostRecent };
        }).sort((a, b) => b.mostRecent - a.mostRecent || b.total - a.total);

        const filtered = rankedList.filter(m => m.name.toLowerCase().includes(filter));
        document.getElementById('shownCount').innerText = `${filtered.length} members shown`;

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--color-text-muted); font-weight:700; background:white; border-radius:6px; border:1px solid var(--color-border-light);">No rankings available.</div>`;
            return;
        }

        let html = '';
        filtered.forEach((m, idx) => {
            let rankBadgeClass = 'r5';
            if (idx === 0) rankBadgeClass = 'r1';
            else if (idx === 1) rankBadgeClass = 'r2';
            else if (idx === 2) rankBadgeClass = 'r3';
            else if (idx === 3) rankBadgeClass = 'r4';

            const rankDisplay = idx < 5 ? `<span class="badge-rank ${rankBadgeClass}">${idx + 1}</span>` : `<span style="font-weight:800; color:var(--color-text-muted);">#${idx + 1}</span>`;
            
            html += `
                <div class="ranking-card">
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div style="width: 32px; text-align: center;">${rankDisplay}</div>
                        <div>
                            <div style="font-weight: 800; font-size: 14px; color: var(--color-text-dark);">${m.name}</div>
                            <div style="font-size: 11px; color: var(--color-text-muted); font-weight: 600; margin-top: 2px;">
                                Latest Sunday Tally: ${m.mostRecent.toLocaleString()} pts (Overall: ${m.total.toLocaleString()})
                            </div>
                        </div>
                    </div>
                    <div style="text-align: right; font-size: 16px; font-weight: 800; color: var(--color-primary-dark);">
                        ${m.mostRecent.toLocaleString()} pts
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    window.promptAddVsWeek = function() {
        if (!isManagementOrAdmin) return;
        const weekName = prompt('Enter new Sunday weekly tally label (e.g., Sun 07-06):');
        if (weekName) {
            vsData.weeks.push(weekName);
            vsData.membersScores.forEach(m => m.scores.push(0));
            saveData();
            renderVsPoints();
        }
    };

    window.editVsScore = function(memberId, weekIdx) {
        if (!isManagementOrAdmin) return;
        const member = vsData.membersScores.find(m => String(m.id) === String(memberId));
        if (!member) return;
        
        const newVal = prompt(`Manually edit score for ${member.name} (${vsData.weeks[weekIdx]}):`, member.scores[weekIdx]);
        if (newVal !== null) {
            member.scores[weekIdx] = parseFloat(newVal) || 0;
            saveData();
            renderVsPoints();
        }
    };

    window.handleVsScreenshotImport = function(event) {
        if (!isManagementOrAdmin) return;
        const file = event.target.files[0];
        if (!file) return;

        alert('Reading screenshot data and extracting weekly VS points...');
        setTimeout(() => {
            vsData.membersScores.forEach(m => {
                const randomExtra = Math.floor(Math.random() * 3000000) + 10500000;
                if (m.scores.length > 0) {
                    m.scores[m.scores.length - 1] = randomExtra;
                } else {
                    m.scores.push(randomExtra);
                }
            });
            saveData();
            renderVsPoints();
            alert('Screenshot successfully parsed and synced to the latest Sunday ranking tally!');
        }, 800);
    };

    document.addEventListener('DOMContentLoaded', () => {
        loadData();
    });
</script>
</body>
</html>
