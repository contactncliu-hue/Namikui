<style>
    :root {

    body {

    .back-link:hover { text-decoration: underline; }

        color: var(--color-text-muted);

    .toolbar-card {

    .toolbar-card__label {

    }
    .search-box { flex-grow: 1; max-width: 320px; position: relative; }
    .search-box input {
        width: 100%;
        padding: 9px 12px 9px 32px;

        background-color: #f7f6f0;
        border-radius: 4px;
        font-size: 13px;
        font-family: var(--font-family-base);
        outline: none;
    }
    .search-box__icon {
        position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
        color: #9ca3af; font-size: 13px;
    }
    .btn-gold {
        margin-left: auto;
        background-color: var(--color-gold-bg);

        font-family: var(--font-family-base);
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.5px;
        padding: 10px 18px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s;
    }
    .btn-gold:hover { background-color: var(--color-gold); color: white; }

    /* Legend */
    .legend-row {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        font-family: var(--font-family-base);
        font-weight: 700;
        font-size: 12px;
        color: var(--color-text-dark);
        margin-bottom: 16px;
        padding: 0 4px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-hint { color: var(--color-text-muted); font-weight: 600; font-size: 11px; width: 100%; margin-top: -4px; }

        width: 24px; height: 24px;

        font-weight: 800;
        font-size: 11px;

    }

    .slot-badge--unassigned { border: 2px dashed var(--color-unassigned); background: white; }

        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
    }

    table {
